name: Sync UMO members and deploy GitHub Pages

on:
  # Taiwan time: every Monday at 08:17 (UTC 00:17).
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Sync official member list
        run: npm run sync:members

      - name: Commit updated static JSON when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/members.json
          if git diff --cached --quiet; then
            echo "Member JSON did not change; no commit needed."
          else
            git commit -m "chore: weekly UMO member data sync"
            git push origin HEAD:main
          fi

